name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 18 * * *" # daily at 18:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  skyline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Gluthoric
      - name: Commit & push
        run: |
          git config user.name 'profile-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A profile-3d-contrib
          if [[ -n "$(git status --porcelain profile-3d-contrib)" ]]; then
            git commit -m "chore: update 3D contribution graph"
            git push
          else
            echo "3D contrib unchanged."
          fi
